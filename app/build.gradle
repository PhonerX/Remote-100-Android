plugins { id 'com.android.application' }
android {
    namespace 'nu.firetech.android.remote100'
    compileSdk 35
    defaultConfig {
        applicationId 'nu.firetech.android.remote100'
        minSdk 8
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
    flavorDimensions 'generation'
    productFlavors {
        legacy { dimension 'generation'; minSdk 8; targetSdk 28; versionNameSuffix '-legacy' }
        lollipop { dimension 'generation'; minSdk 21; targetSdk 28; versionNameSuffix '-lollipop' }
        oreo { dimension 'generation'; minSdk 26; targetSdk 28; versionNameSuffix '-oreo' }
        modern { dimension 'generation'; minSdk 31; targetSdk 35; versionNameSuffix '-modern' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
